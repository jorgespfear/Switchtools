name: Build NRO
on:
  push:
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar SDL2 y curl (instalar solo si faltan)
        run: |
          if dkp-pacman -Q switch-sdl2 switch-curl; then
            echo "SDL2 y curl ya estan instalados en la imagen"
            exit 0
          fi
          for i in 1 2 3 4 5; do
            if dkp-pacman -Sy --noconfirm switch-sdl2 switch-curl; then exit 0; fi
            echo "Intento $i fallido, reintentando en 30s..."
            sleep 30
          done
          dkp-pacman -S --noconfirm switch-sdl2 switch-curl
      - name: Version desde la etiqueta (solo en releases)
        if: github.event_name == 'release'
        run: |
          tag="${{ github.event.release.tag_name }}"
          tag="${tag#v}"; tag="${tag#V}"
          echo "MAKEVER=APP_VERSION=$tag" >> "$GITHUB_ENV"
          echo "Version: $tag"
      - name: Compilar Storage Analyzer
        run: make -C SwitchStorageAnalyzer $MAKEVER
      - name: Compilar Speed Test
        run: make -C SwitchSpeedTest $MAKEVER
      - name: Compilar SD Benchmark
        run: make -C SDBenchmark $MAKEVER
      - name: Compilar Save Sync
        run: make -C SwitchSaveSync $MAKEVER
      - name: Subir los .nro
        uses: actions/upload-artifact@v4
        with:
          name: SwitchTools-nro
          path: |
            SwitchStorageAnalyzer/SwitchStorageAnalyzer.nro
            SwitchSpeedTest/SwitchSpeedTest.nro
            SDBenchmark/SDBenchmark.nro
            SwitchSaveSync/SwitchSaveSync.nro
      - name: Adjuntar los .nro a la release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            SwitchStorageAnalyzer/SwitchStorageAnalyzer.nro
            SwitchSpeedTest/SwitchSpeedTest.nro
            SDBenchmark/SDBenchmark.nro
            SwitchSaveSync/SwitchSaveSync.nro
